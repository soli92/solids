<!DOCTYPE html>

<title>Toast di notifica - direzioni (solids)</title>
<style>
:root{
  /* Valori da src/tokens/base.json + semantic.json (tema light) */
  --sd-color-gray-50:#F9FAFB;--sd-color-gray-100:#F3F4F6;--sd-color-gray-200:#E5E7EB;--sd-color-gray-300:#D1D5DB;--sd-color-gray-400:#9CA3AF;--sd-color-gray-500:#6B7280;--sd-color-gray-600:#4B5563;--sd-color-gray-900:#111827;

  --sd-color-intent-warning:#D97706;--sd-color-intent-warning-bg:#FFFBEB;--sd-color-intent-warning-border:#FBBF24;
  --sd-color-intent-danger:#DC2626;--sd-color-intent-danger-bg:#FEF2F2;--sd-color-intent-danger-border:#F87171;
  --sd-color-intent-info:#2563EB;--sd-color-intent-info-bg:#EFF6FF;--sd-color-intent-info-border:#93C5FD;

  --sd-color-muted-foreground:#6B7280;

  --sd-radius-sm:8px;--sd-radius-md:12px;--sd-radius-lg:16px;--sd-radius-xl:20px;--sd-radius-full:9999px;
  --radius:var(--sd-radius-md);--radius-md:calc(var(--radius) - 2px);--radius-sm:calc(var(--radius) - 4px);

  --sd-font-size-xs:0.75rem;--sd-font-size-sm:0.875rem;--sd-font-size-base:1rem;--sd-font-size-2xl:1.5rem;

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sd-color-bg-canvas);color:var(--sd-color-text-primary);font-family:var(--sd-font-body);font-size:var(--sd-font-size-base);line-height:var(--sd-font-leading-normal);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--sd-color-border-focus);outline-offset:2px}
[data-proto-variant]{min-height:100vh}
.tv-page{max-width:640px;margin:0 auto;padding:72px 24px 160px}
.tv-eyebrow{margin:0 0 var(--sd-space-sm);font-size:var(--sd-font-size-xs);color:var(--sd-color-text-tertiary);letter-spacing:.025em}
.tv-h1{margin:0 0 var(--sd-space-sm);font-family:var(--sd-font-heading);font-size:var(--sd-font-size-2xl);line-height:var(--sd-font-leading-tight);font-weight:var(--sd-font-weight-semibold)}

.tv-actions{display:flex;flex-wrap:wrap;gap:var(--sd-space-sm)}
.tv-btn{min-height:var(--sd-touch-target-min);padding:0 16px;border:1px solid var(--sd-color-border-default);border-radius:var(--radius-md);background:var(--sd-color-bg-elevated);color:var(--sd-color-text-primary);font:inherit;font-size:var(--sd-font-size-sm);font-weight:var(--sd-font-weight-medium);cursor:pointer}

/* toast: struttura condivisa */
.tv-region{position:fixed;z-index:var(--sd-z-toast);pointer-events:none}
.tv-toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:12px;color:var(--sd-color-text-primary);font-size:var(--sd-font-size-sm)}
.tv-ico{flex:none;display:inline-flex;width:20px;height:20px}

.tv-avatar{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--sd-radius-full);background:var(--sd-color-primary-subtle);color:var(--sd-color-primary-default);font-size:var(--sd-font-size-xs);font-weight:var(--sd-font-weight-semibold);letter-spacing:.025em}
.tv-body{flex:1;min-width:0}

.tv-desc{margin:2px 0 0;color:var(--sd-color-text-secondary);line-height:var(--sd-font-leading-normal)}
.tv-action{flex:none;height:32px;padding:0 12px;border:1px solid var(--sd-color-border-default);border-radius:var(--radius-md);background:transparent;color:inherit;font:inherit;font-weight:var(--sd-font-weight-medium);cursor:pointer}

.tv-close:hover{color:var(--sd-color-text-primary);background:var(--sd-color-secondary-default)}

@media (prefers-reduced-motion:reduce){[data-proto-variant] *,[data-proto-variant] *::before{transition:none!important;animation:none!important}}

/* 1 Quieta: motion quasi assente, bordi al posto delle ombre */
[data-proto-variant="1"]{--tv-exit:150}
[data-proto-variant="1"] .tv-region{right:16px;bottom:72px;width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px}
[data-proto-variant="1"] .tv-toast{padding:12px 12px 12px 16px;background:var(--sd-color-bg-elevated);border:1px solid var(--sd-color-border-default);border-radius:var(--radius-md);box-shadow:none;opacity:0;transition:opacity var(--sd-duration-fast) linear}
[data-proto-variant="1"] .tv-toast[data-state="open"]{opacity:1}

/* 2 Pila: stack sovrapposto, si espande al passaggio del mouse, swipe per chiudere */
[data-proto-variant="2"]{--tv-exit:350}
[data-proto-variant="2"] .tv-region{right:16px;bottom:72px;width:min(380px,calc(100vw - 32px));height:0}
[data-proto-variant="2"] .tv-toast{position:absolute;right:0;bottom:0;width:100%;padding:16px;background:var(--sd-color-bg-elevated);border:1px solid var(--sd-color-border-muted);border-radius:var(--sd-radius-lg);box-shadow:var(--sd-shadow-xl);transform-origin:bottom center;touch-action:pan-y;transition:transform var(--sd-duration-emphasized) var(--sd-easing-emphasized-decelerate),opacity var(--sd-duration-emphasized) var(--sd-easing-emphasized-decelerate)}

/* 3 Banner: ancorato in alto al centro, uno alla volta, compatto, barra di avanzamento */
[data-proto-variant="3"]{--tv-exit:200}
[data-proto-variant="3"] .tv-region{top:16px;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 32px))}
[data-proto-variant="3"] .tv-toast{padding:8px 8px 8px 12px;min-height:44px;overflow:hidden;border:1px solid var(--tv-b);background:var(--tv-bg);border-radius:var(--radius-md);box-shadow:var(--sd-shadow-md);opacity:0;transform:translateY(-12px);transition:transform var(--sd-duration-normal) var(--sd-easing-ease-out),opacity var(--sd-duration-normal) var(--sd-easing-ease-out)}

[data-proto-variant="3"] .tv-toast[data-kind="user"]{--tv-bg:var(--sd-color-intent-info-bg);--tv-b:var(--sd-color-intent-info-border);--tv-c:var(--sd-color-intent-info)}
[data-proto-variant="3"] .tv-body{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
[data-proto-variant="3"] .tv-desc{margin:0}
[data-proto-variant="3"] .tv-avatar{width:28px;height:28px;background:var(--sd-color-bg-elevated)}
[data-proto-variant="3"] .tv-action{border-color:var(--tv-b);background:var(--sd-color-bg-elevated)}
[data-proto-variant="3"] .tv-progress{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--tv-c);transform-origin:left;animation:tv-shrink var(--tv-life,5000ms) linear forwards}
[data-proto-variant="3"] .tv-toast[data-paused] .tv-progress{animation-play-state:paused}

/* selettore (cromo neutro, indipendente dai token) */
.pv-bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483647;
  display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;

.pv-bar[data-position="top"]{bottom:auto;top:24px}
.pv-group{position:relative;display:flex;align-items:center;gap:2px}

.pv-bar[data-ready] .pv-mark{transition:transform 200ms cubic-bezier(.23,1,.32,1),width 200ms cubic-bezier(.23,1,.32,1)}
.pv-opt,.pv-replay{position:relative;height:28px;padding:0 12px;border:0;border-radius:999px;

<script>

(function(){
  var SVG={
    success:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>',
    error:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>',
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
  };
  var MSG={
    saved:{kind:'success',title:'Bozza salvata',desc:'Le modifiche a \u00abContratto fornitura Rossi\u00bb sono state salvate alle 14:32.'},
    error:{kind:'error',title:'Salvataggio non riuscito',desc:'Connessione assente: \u00abFattura 2026-0187\u00bb non \u00e8 stata inviata.',action:'Riprova'},
    sent:{kind:'success',title:'Fattura inviata',desc:'\u00abFattura 2026-0187\u00bb \u00e8 stata inviata a Rossi Forniture Srl.'},
    user:{kind:'user',title:'Marta Ricci',desc:'ha commentato \u00abPiano di rilascio Q4\u00bb: \u201cPossiamo anticipare il collaudo al 18?\u201d',action:'Apri',initials:'MR'}
  };
  var LIFE=5000;
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

    var b=el('div','tv-body');
    b.appendChild(el('p','tv-title',esc(m.title)));
    b.appendChild(el('p','tv-desc',esc(m.desc)));

    if(t._leaving)return;t._leaving=true;clearTimeout(t._timer);t._timer=null;
    var i=c.list.indexOf(t);if(i>-1)c.list.splice(i,1);
    t.setAttribute('data-leaving','');t.removeAttribute('data-state');

    var ms=instant?0:+getComputedStyle(c.region.parentNode).getPropertyValue('--tv-exit')||150;

  }

    var open=c.region.hasAttribute('data-expanded'),y=0,n=c.list.length;

    var x0=null;
    t.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;x0=e.clientX;t._dx=0;t.setAttribute('data-swiping','');t.setPointerCapture(e.pointerId);});
    t.addEventListener('pointermove',function(e){if(x0===null)return;t._dx=Math.max(0,e.clientX-x0);t.style.transform='translateX('+t._dx+'px)';});
    function end(){if(x0===null)return;var d=t._dx;x0=null;t.removeAttribute('data-swiping');t._dx=0;if(d>80){dismiss(c,t);}else{layout(c);}}
    t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  }
  document.addEventListener('click',function(e){
    var root=e.target.closest('[data-proto-variant]');if(!root)return;
    var trg=e.target.closest('[data-trigger]');
    if(trg){push(root,trg.getAttribute('data-trigger'));return;}
    var t=e.target.closest('.tv-toast');if(!t)return;
    var c=ctx(root);
    if(e.target.closest('[data-close]')){dismiss(c,t);return;}
    var a=e.target.closest('[data-act]');
    if(a){
      if(t._m.kind==='error'){
        a.disabled=true;a.textContent='Riprovo\u2026';a.setAttribute('aria-busy','true');
        setTimeout(function(){dismiss(c,t);push(root,'sent');},900);
      }else{dismiss(c,t);}
    }
  });
  document.addEventListener('mouseover',function(e){var r=e.target.closest&&e.target.closest('[data-proto-variant="2"] .tv-region');if(r&&!r.hasAttribute('data-expanded')){r.setAttribute('data-expanded','');layout(ctx(r.parentNode));}});
  document.addEventListener('mouseout',function(e){var r=e.target.closest&&e.target.closest('[data-proto-variant="2"] .tv-region');if(r&&!(e.relatedTarget&&r.contains(e.relatedTarget))){r.removeAttribute('data-expanded');layout(ctx(r.parentNode));}});
  document.addEventListener('focusin',function(e){var r=e.target.closest&&e.target.closest('[data-proto-variant="2"] .tv-region');if(r){r.setAttribute('data-expanded','');layout(ctx(r.parentNode));}});
  document.addEventListener('focusout',function(e){var r=e.target.closest&&e.target.closest('[data-proto-variant="2"] .tv-region');if(r&&!(e.relatedTarget&&r.contains(e.relatedTarget))){r.removeAttribute('data-expanded');layout(ctx(r.parentNode));}});
})();

</script>
<script>

const tpls=[...document.querySelectorAll('template[data-variant-name]')];
const stage=document.getElementById('pv-stage');
const group=document.querySelector('.pv-group');
const opts=[...group.querySelectorAll('.pv-opt')];
const mark=group.querySelector('.pv-mark');
const live=document.querySelector('.pv-live');
let cur=0;
function place(){const o=opts[cur];mark.style.width=o.offsetWidth+'px';mark.style.transform='translateX('+o.offsetLeft+'px)';}
function mount(i){stage.textContent='';requestAnimationFrame(()=>{const n=tpls[i].content.cloneNode(true);const root=n.firstElementChild;if(root)root.setAttribute('data-proto-variant',i+1);stage.appendChild(n);});}
function select(i,focus){if(i<0||i>=tpls.length)return;cur=i;
  opts.forEach((o,j)=>{o.setAttribute('aria-checked',String(j===i));o.tabIndex=j===i?0:-1;});
  if(focus)opts[i].focus();
  place();live.textContent=tpls[i].dataset.variantName;
  try{const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);}catch(_){}
  mount(i);}
opts.forEach((o,i)=>o.addEventListener('click',()=>select(i,false)));
document.querySelector('.pv-replay')?.addEventListener('click',()=>mount(cur));
addEventListener('resize',place);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const n=parseInt(e.key,10),inGroup=group.contains(e.target);
  if(n>=1&&n<=tpls.length)select(n-1,inGroup);
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();select((cur+(e.key==='ArrowRight'?1:-1)+tpls.length)%tpls.length,inGroup);}
  else if(e.key==='Home'&&inGroup){e.preventDefault();select(0,true);}
  else if(e.key==='End'&&inGroup){e.preventDefault();select(tpls.length-1,true);}
  else if(e.key==='r'||e.key==='R')mount(cur);});
select((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1,false);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector('.pv-bar').setAttribute('data-ready','')));

</script>
