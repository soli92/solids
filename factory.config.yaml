factory:
  name: solids-design-system
  description: "SoliDS — Design system React (@soli92/solids)"

pattern_version: "2.42"
topology: knowledge-only

code_paths:
  - name: solids
    path: .
    layers: [docs, fe]
    vcs:
      mode: monorepo
      branch_strategy: feature-branch
      commit_coupling: decoupled

stack:
  mode: manual

routing:
  docs: agent
  fe: agent

analytics:
  dogfooding:
    enabled: true

design_intelligence:
  enabled: true

# === v2.22→v2.32 opt-in capability stubs (added by 2.21→2.32 upgrade) ============
# Tutti gli stub sono default-OFF (R.P3 opt-in totale): a flag spento la factory
# si comporta esattamente come a v2.21. Abilita esplicitamente ciò che ti serve.

# Central Model Registry (v2.27, PATTERN §29.2) — unico posto per i model ID
models:
  routing:
    tier_fast:    claude-haiku-4-5-20251001   # ruoli ad alta frequenza / basso costo
    tier_default: claude-sonnet-4-6            # maggioranza degli agenti
    tier_deep:    claude-opus-4-8              # ruoli di ragionamento profondo
  overrides: {}                                # eccezioni per-agente, es. wiki-query: tier_fast

# Hybrid Wiki Search Layer (v2.29, EP-042, PATTERN §31)
wiki_search:
  enabled: false                              # opt-in esplicito (R.WS2)

# Temporal Generative Time Model (v2.30, EP-043)
temporal:
  estimate_protocol:
    enabled: false                            # opt-in EP-043 US-152 (R.P3 default off)

# Capability Formativa — tutoring adattivo MVP (v2.32, EP-045)
capability_formativa:
  enabled: false                              # abilita agente tutor + skill EP-045
  wiki_search_integration: false              # integra EP-042 se disponibile (opt-in)

# Tavola Rotonda Mode (v2.27, EP-039, PATTERN §28)
tavola_rotonda:
  enabled: false                              # opt-in totale (R.P3-TR)

# Prototype Generation Layer (v2.26, EP-035, PATTERN §27)
prototyping:
  enabled: false                              # master switch EP-035 (R.P3 default off)

# Parallel Scheduler (v2.11)
scheduler:
  enabled: true
  max_parallel: 20

# Content Share Consumer Layer (v2.33, EP-048, PATTERN §32)
content_share:
  enabled: false                              # R.CS2 opt-in
  target_repo: "soli92/soli-frames"
  source_repo_slug: "solids"                  # obbligatorio se enabled: true
  source_repo: "soli92/solids"               # formato org/repo
  pat_env: SOLI_FRAMES_PAT
  secret_env: SOLI_FRAMES_DISPATCH_SECRET
  publish_default: draft
  size_limit_kb: 100
  size_warn_kb: 80
  artifact_categories:
    prototype: true
    analytics_report: true
    custom: true

# === v2.34→v2.42 opt-in capability stubs (added by 2.33→2.42 upgrade) ============
# Tutti gli stub sono default-OFF (R.P3 opt-in totale): a flag spento la factory
# si comporta esattamente come a v2.33. Abilita esplicitamente ciò che ti serve.

# Voice Channel Layer (v2.28, EP-041, PATTERN §30)
voice_channel:
  enabled: false                              # opt-in modulo voice/ esterno

# Code Intelligence Stack (v2.37, EP-054, PATTERN §33)
code_intelligence:
  enabled: false                              # master switch L1+L2+L3
  l1_ctags:
    enabled: false                            # universal-ctags symbol resolver
  l2_semantic:
    enabled: false                            # tree-sitter + nomic-embed + LanceDB
  l3_impact:
    enabled: false                            # graphify blast radius Fase 0.bis dev-protocol

# Semantic Purpose Layer (v2.38, EP-055, PATTERN §34)
wiki_purpose:
  enabled: false                              # opt-in wiki/purpose.md consumato da wiki-keeper

# Wiki Sweep — semantic quality pass (v2.38, EP-056, PATTERN §35)
wiki_sweep:
  enabled: false                              # opt-in sweep-reviews-protocol + comando /sweep-reviews

# Ponytail Decision Ladder (v2.39, EP-057)
ponytail:
  enabled: false                              # opt-in YAGNI ladder 7 livelli (Check 4ao + Pass 4 advisory)
  passes:
    yagni_ladder: false                       # HARD DEP: richiede code_quality.enabled: true
  lint:
    severity: warning                         # warning|info (forzato info se code_path: ".")
  audit:
    exclude_patterns: []                      # glob patterns esclusi da /ponytail-audit

# MCP Server adapter (v2.39, EP-058)
mcp_server:
  enabled: false                              # opt-in adapter read-only MCP

# Fleet Health — Refactor Agent Skills (v2.41, EP-060, PATTERN §36)
refactor_agent_skills:
  enabled: false                              # opt-in skill refactor-agent-skills + agente fleet-doctor
                                              # Check 4ap WARNING-only

# Session Observability (v2.42, EP-062)
session_analysis:
  enabled: false                              # opt-in tools/session-analysis + comando /session-analysis
