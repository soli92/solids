# =============================================================================
# analytics/pricing.yaml — Pricing table (LLM model costs + deterministic tools)
# =============================================================================
# EP-009 (Task Analytics & Measurement) — ADR-022 §B
# Capability: [[task-analytics-cost-estimation-capability]]
#   wiki/concepts/task-analytics-cost-estimation-capability.md
#
# TEMPLATE opt-in (R.P3): this is a *.template. Copy it to
# `analytics/pricing.yaml` and adapt it. Until the non-template file exists and
# `analytics.measurement.enabled` remains false, nothing is activated (no lint ERROR).
#
# Single-writer logical owner: PM/Arch of the derived factory, **manual via PR**.
#   No framework tool modifies this file at runtime.
# Readers: compute_agentic_cost (US-034), build_reference_class (US-041),
#          report (US-037) — via the `cost-and-time-analytics` skill (US-036).
#
# Versioning: **git history** is the authoritative history. There is NO internal
#   `version:` field. Every change = one conventional commit
#   (e.g. `chore(pricing): bump claude-opus-4-7 input price 2026-07-01`).
#
# INVARIANT — never hardcode prices in tools: cost tools ALWAYS read
#   from here. An unknown model → fail-loud (see ADR-022 §D / §G), never
#   silent zero-cost imputation.
#
# valid_from semi-open on the right (ADR-022 §E): an entry is valid from its
#   `valid_from` until the **next** entry replaces it. List
#   sorted ascending by `valid_from`. At least one entry per model.
#
# No retroactive edit (ADR-022 §E): do NOT modify an entry with `valid_from`
#   in the past (you would alter already computed historical costs). To change price:
#   append a new entry. For a true anomalous data fix: explicit commit
#   `fix(pricing): retroactive correction for entry valid_from=YYYY-MM-DD, reason=...`.
# =============================================================================

currency: USD                          # ISO 4217. Single currency per file (ADR-022 §B). The values below are the official Anthropic list prices in USD/1M tokens (source: skill claude-api). fix: it was labelled EUR while the numbers were already USD — label correction, not a price change (ADR-022 §E: no retroactive edit of values). cost_alert.py compares against threshold_usd only when this says USD.

# Cache writes: cache_write_per_1m_tokens = 5m TTL (1.25x input),
#   cache_write_1h_per_1m_tokens = 1h TTL (2x input). Events and transcripts carry
#   cache_write (total) and cache_write_1h (the 1h part): the rest is paid at 5m.
#   Without the 1h field on a model, the 1h part is also paid at the 5m price.

models:
  - id: claude-opus-4-7                # <<model_id>> canonical: lowercase, kebab-case, no dots, no version [brackets].
    provider: anthropic                # informational; no logic depends on this field.
    display_name: "Claude Opus 4.7"    # human-readable for reports.
    aliases:                           # inverse mapping: raw variants accepted in the event, resolved to `id`.
      - claude-opus-4.7                #   Anthropic SDK format (dots)
      - claude-opus-4-7[1m]            #   Claude Code format (suffix bracket)
      - anthropic/claude-opus-4-7      #   OpenRouter format (provider prefix)
    pricing:                           # list sorted asc by valid_from. At least one entry required.
      # fix(pricing): retroactive correction for entry valid_from=2026-01-01, reason=previous
      # values (15/75) not aligned with official Anthropic list price. Opus 4.7 = $5/$25
      # (same as Opus 4.8). Source: skill claude-api 2026. Also removed fabricated
      # 2026-07-01 tier (12/60, no known real list price change). Units: USD/1M (see opus-4-8 caveat).
      - valid_from: 2026-01-01
        input_per_1m_tokens: 5.0
        output_per_1m_tokens: 25.0
        cache_read_per_1m_tokens: 0.5   # 0.1x input
        cache_write_per_1m_tokens: 6.25 # 1.25x input (5m TTL)
        cache_write_1h_per_1m_tokens: 10

  - id: claude-opus-4-8                # real model for this factory (Claude Code sessions 2026).
    provider: anthropic
    display_name: "Claude Opus 4.8"
    aliases:
      - claude-opus-4.8                #   Anthropic SDK format (dots)
      - claude-opus-4-8[1m]            #   Claude Code format (suffix bracket) — appears in transcripts
      - anthropic/claude-opus-4-8      #   OpenRouter format (provider prefix)
    pricing:
      - valid_from: 2026-01-01
        # OFFICIAL ANTHROPIC LIST PRICES (USD per 1M tokens), source: skill claude-api 2026.
        # NB CURRENCY: rest of file labels fields as "EUR" but opus-4-7 entry above
        # uses numbers not aligned with real opus-4-7 list price ($5/$25). Here I use official USD values.
        # If the factory reasons in EUR, maintainer applies exchange rate (human decision, ADR-022 §A).
        # Cache: read = 0.1x input, write-5m = 1.25x input (standard Anthropic multipliers).
        # Opus 4.8 = 1M context at standard price (no long-context premium).
        input_per_1m_tokens: 5.0
        output_per_1m_tokens: 25.0
        cache_read_per_1m_tokens: 0.5
        cache_write_per_1m_tokens: 6.25
        cache_write_1h_per_1m_tokens: 10

  - id: claude-opus-5-5                # Opus 5.5 (current, default model of Claude Code sessions from 2026-10).
    provider: anthropic
    display_name: "Claude Opus 5.5"
    aliases:
      - claude-opus-5.5                #   Anthropic SDK format (dots)
      - claude-opus-5-5[1m]            #   Claude Code format (suffix bracket)
      - anthropic/claude-opus-5-5      #   OpenRouter format (provider prefix)
    pricing:
      - valid_from: 2026-01-01         # USD/1M, source skill claude-api (cache 2026-09-25): input 4, output 20,
        input_per_1m_tokens: 4.0       #   cache read 0.20 DECLARED (0.05x: the 0.1x convention does NOT hold here).
        output_per_1m_tokens: 20.0     #   cache write 5m NOT declared: 1.25x input by convention, to confirm.
        cache_read_per_1m_tokens: 0.2
        cache_write_per_1m_tokens: 5.0
        cache_write_1h_per_1m_tokens: 8
  - id: claude-opus-5                  # Opus 5 (raw model id of the sessions of 2026-09: 51 events).
    provider: anthropic
    display_name: "Claude Opus 5"
    aliases:
      - claude-opus-5[1m]              #   Claude Code format (suffix bracket)
      - anthropic/claude-opus-5        #   OpenRouter format (provider prefix)
